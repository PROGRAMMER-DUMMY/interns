[project]
name = "autoresearch"
version = "2.0.0"
description = "Autonomous experiment agent with intern system"
requires-python = ">=3.10"

dependencies = [
    # Config
    "toml>=0.10.2",
    # ML training tasks — uncomment if using train.py
    # "torch>=2.3",
    # "transformers>=4.40",
    # "tiktoken>=0.6",
    # "datasets>=2.19",
    # Workflow / data pipeline tasks — uncomment as needed
    # "httpx>=0.27",
    # "pandas>=2.2",
    "notebook>=7.5.6",
    "polars>=1.40.1",
    "rich>=15.0.0",
    "deltalake>=1.5.1",
    "pyspark>=3.5.1",    # NOTE: Lowered from 4.1.1 (Spark 4 is not officially released yet)
    "sqlalchemy>=2.0.49",
    "pyarrow>=4.0.0",    # relaxed upper bound — mlflow 3.x requires pyarrow<24
    "numpy>=1.26,<2.0",  # <--- THE FIX: Capped below 2.0 to prevent ancient numba fallback
    "scikit-learn>=1.5",
    "shap>=0.46",
    "fastexcel>=0.12.0",
    "duckdb>=1.5.2",
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    # Databricks integration
    "databricks-sdk>=0.20",
    "mlflow>=3.0",
    "tabulate>=0.10.0",
    "pdfplumber>=0.11.9",
    "pyyaml>=6.0",
]

[project.scripts]
loop      = "core.orchestration.loop:main"
cli-inspect = "core.agents.cli_inspector:main"
onboard-workspace = "core.onboarding.workspace_onboarding:main"
kickstart-workspace = "core.onboarding.kickstart_workspace:main"
resolve-kpi-features = "core.onboarding.kpi_feature_resolver:main"
generate-kpi-sql = "core.onboarding.kpi_sql_generator:main"
cleanup-workspace-references = "core.onboarding.workspace_cleanup:main"
derived-feature-markdown = "core.onboarding.derived_feature_markdown:main"
blocker-question-panel = "core.onboarding.blocker_question_panel:main"
validate-workspace-artifacts = "core.onboarding.workspace_artifact_validator:main"
prepare-kpi-blocker-panel = "core.onboarding.kpi_blocker_cli:prepare_main"
apply-kpi-panel-answer = "core.onboarding.kpi_blocker_cli:apply_main"
plan-source-to-target = "core.onboarding.source_to_target_planner:main"
build-relationship-contracts = "core.onboarding.relationship_contracts:main"
prepare-kpi-generation = "core.onboarding.kpi_generation_cli:prepare_main"
apply-kpi-generation-answer = "core.onboarding.kpi_generation_cli:apply_main"
finalize-kpi-generation = "core.onboarding.kpi_generation_cli:finalize_main"
prepare-data-model-generation = "core.onboarding.data_model_generation_cli:prepare_main"
apply-data-model-answer = "core.onboarding.data_model_generation_cli:apply_main"
finalize-data-model-generation = "core.onboarding.data_model_generation_cli:finalize_main"
prepare-databricks-assets = "core.onboarding.databricks_assets:main"
prepare-genie-workspace = "core.onboarding.genie_workspace:main"
deploy-databricks-workspace = "core.onboarding.databricks_workspace_deployer:main"
generate-skill-adapters = "core.skills.adapter_generator:main"
list-workspace-files = "tools.list_workspace_files:main"
design-medallion = "core.medallion.design_cli:main"
build-medallion = "core.medallion.build_cli:main"
medallion-lineage = "core.medallion.lineage_cli:main"
medallion-init-salt = "core.medallion.salt_store:_init_salt_cli"
prepare   = "prepare:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "interns"]

# <--- THE FIX: Updated to the new uv standard to remove the dev-dependencies warning
[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
]

# Optional extras: install with `uv sync --extra databricks-full`
[project.optional-dependencies]
databricks-full = [
    "databricks-sql-connector>=3.0",   # warehouse execution mode
    "databricks-connect>=14.3,<15; python_version >= '3.10' and python_version < '3.11'",
    "databricks-connect>=15.4.10,<16; python_version >= '3.11' and python_version < '3.12'",
    "databricks-connect>=16.4.1,<17; python_version >= '3.12' and python_version < '3.13'",
    "pandas>=2.2",                     # required by mlflow.evaluate()
]
enterprise-metadata = [
    "pymongo>=4.7",
]

[tool.ruff]
line-length    = 100
target-version = "py310"
