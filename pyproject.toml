medallion-lineage = "core.medallion.lineage_cli:main"
medallion-init-salt = "core.medallion.salt_store:_init_salt_cli"
prepare   = "prepare:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "interns"]

# <--- THE FIX: Updated to the new uv standard to remove the dev-dependencies warning
[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
]

# Optional extras: install with `uv sync --extra databricks-full`
#
# Additive extras (added 2026-05): these groups list dependencies that are
# ALSO present in the default [dependencies] block above. They exist so that
# a future commit can move those packages OUT of core and into the extras
# without breaking existing installs. Today, `uv sync` still installs
# everything; tomorrow, `uv sync --no-default-extras --extra dashboard` (or
# similar) can produce a slimmer headless install.
[project.optional-dependencies]
databricks-full = [
    "databricks-sql-connector>=3.0",   # warehouse execution mode
    "databricks-connect>=14.3,<15; python_version >= '3.10' and python_version < '3.11'",
    "databricks-connect>=15.4.10,<16; python_version >= '3.11' and python_version < '3.12'",
    "databricks-connect>=16.4.1,<17; python_version >= '3.12' and python_version < '3.13'",
    "pandas>=2.2",                     # required by mlflow.evaluate()
]
enterprise-metadata = [
    "pymongo>=4.7",
]
dashboard = [
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
]
dashboard-testing = [
    "dash[testing]>=4.1.0",
]
ml = [
    "scikit-learn>=1.5",
    "shap>=0.46",
]
documents = [
    "pdfplumber>=0.11.9",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.0",
    "fastexcel>=0.12.0",
]
notebook = [
    "notebook>=7.5.6",
]
databricks = [
    "databricks-sdk>=0.20",
    "mlflow>=3.0",
    "pyspark>=3.5.1,<4",
    "deltalake>=1.5.1",
]

[tool.ruff]
line-length    = 100
target-version = "py310"
