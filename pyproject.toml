discover-external-sources = "core.onboarding.sources.external_discovery:main"
prepare-external-source-intake = "core.onboarding.sources.external_intake_cli:prepare_main"
apply-external-source-intake = "core.onboarding.sources.external_intake_cli:apply_main"
resource-preflight = "core.resource.cli:main"
prepare-databricks-assets = "core.onboarding.databricks.assets:main"
prepare-genie-workspace = "core.onboarding.databricks.genie_workspace:main"
deploy-databricks-workspace = "core.onboarding.databricks.workspace_deployer:main"
generate-skill-adapters = "core.skills.adapter_generator:main"
list-workspace-files = "tools.list_workspace_files:main"
prepare-workspace-selection = "tools.workspace_selection_harness:main"
session-snapshot = "tools.session_snapshot:main"
validate-git-hygiene = "tools.git_hygiene:main"
design-medallion = "core.medallion.design_cli:main"
