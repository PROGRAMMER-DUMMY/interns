[project]
name = "autoresearch"
version = "2.0.0"
description = "Autonomous experiment agent with intern system"
requires-python = ">=3.10"

dependencies = [
    # Config
    "toml>=0.10.2",
    # ML training tasks — uncomment if using train.py
    # "torch>=2.3",
    # "transformers>=4.40",
    # "tiktoken>=0.6",
    # "datasets>=2.19",
    # Workflow / data pipeline tasks — uncomment as needed
    # "httpx>=0.27",
    # "pandas>=2.2",
    "aiohttp>=3.9.5",
    "notebook>=7.5.6",
    "polars>=1.40.1",
    "rich>=15.0.0",
    "deltalake>=1.5.1",
    "pyspark>=3.5.1,<4",  # Pin <4: Spark 4.x (pre-release here) has no matching Delta build
    "sqlalchemy>=2.0.49",
    "pyarrow>=4.0.0",    # relaxed upper bound — mlflow 3.x requires pyarrow<24
    "numpy>=1.26,<2.0",  # <--- THE FIX: Capped below 2.0 to prevent ancient numba fallback
    "scikit-learn>=1.5",
    "shap>=0.46",
    "fastexcel>=0.12.0",
    "xlsxwriter>=3.2.0",
    "duckdb>=1.5.2",
    "sqlglot>=23.0,<25",
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    # Databricks integration
    "databricks-sdk>=0.20",
    "mlflow>=3.0",
    "tabulate>=0.10.0",
    "pdfplumber>=0.11.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "kaleido>=1.3.0",
    "reportlab>=5.0.0",
    "dagster>=1.13.14",
]

