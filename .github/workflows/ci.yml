name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"   # Spark 3.5 supports Java 8/11/17 only -- green-gate's
                                # curated suite includes Spark-backed medallion tests.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (Spark 3.5 / Scala 2.12 + Delta 3.2, pinned to match pyspark-parity job)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyspark==3.5.3" "delta-spark==3.2.0"
          pip install ruff
      - name: Lint (touched modules)
        run: ruff check core/onboarding/kpi core/onboarding/harness core/onboarding/workspace/delegation.py
        continue-on-error: true
      - name: Green gate (curated + enterprise suite -- the platform's own test gate)
        run: python -m core.dev.green_gate --json

  pyspark-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"   # Spark 3.5 supports Java 8/11/17 only
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (Spark 3.5 / Scala 2.12 + Delta 3.2)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyspark==3.5.3" "delta-spark==3.2.0"
      - name: SQL == Polars == PySpark parity
        env:
          CI_RUN_SPARK: "1"
        run: python -m unittest -v tests.test_ci_pyspark_parity

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t autoresearch:${{ github.sha }} .
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: autoresearch:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
