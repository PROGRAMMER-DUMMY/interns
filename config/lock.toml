[meta]
version        = "2.0"
locked         = true
last_edited_by = "human"

# ── API Keys ──────────────────────────────────────────────────────────────────
# Keys are NEVER stored here. Reference environment variable names only.
[api]
google_api_key_env    = "GOOGLE_API_KEY"       # also accepted: GEMINI_API_KEY
gemini_api_key_env    = "GEMINI_API_KEY"
anthropic_api_key_env = "ANTHROPIC_API_KEY"    # optional, for future Claude-based interns

# ── Models ────────────────────────────────────────────────────────────────────
# All model identifiers are locked here. Agents read these via cfg.models.*
[models]
llm_judge           = "gemini-2.0-flash"   # evaluator LLM judge
deep_research       = "gemini-2.0-flash"   # deep research intern
prompt_engineer     = "gemini-2.0-flash"   # prompt engineer intern
eval_intern         = "gemini-2.0-flash"   # eval intern
fallback_strategy   = "rule_based"         # rule_based | skip | fail

# ── CLI Tools ─────────────────────────────────────────────────────────────────
# Locked CLI references. If a tool is renamed or relocated, update here only.
[cli]
gemini = "gemini"    # gemini CLI — must be in PATH and authenticated
python = "python"    # Python interpreter

# ── Backends ──────────────────────────────────────────────────────────────────
[backends]
primary   = "api"    # api | cli
force_cli = false    # true → always use gemini CLI regardless of API key presence

# ── Main agent (who is driving the loop) ──────────────────────────────────────
# Set this to whichever CLI tool you are running as the experiment agent.
# The system uses this to decide how interns behave:
#   - "claude-code"  → Claude Code CLI   (claude command)
#   - "gemini-cli"   → Gemini CLI        (gemini command)
#   - "codex"        → OpenAI Codex CLI  (codex command)
#   - "api"          → direct API key only, no CLI agent
# When main_agent is a CLI tool, interns skip their own LLM calls and return
# structured prompts for the main agent to reason over directly.
[agent]
main_agent = "gemini-cli"  # change to gemini-cli or codex if using those

# ── Databricks Integration ────────────────────────────────────────────────────
# Set enabled = true and fill env vars to activate Databricks execution + MLflow.
# When enabled = false (default), DuckDB + SQLite are used — no behaviour change.
[databricks]
enabled            = true           # flip to true to activate
execution          = "jobs"         # jobs | warehouse | connect | duckdb
loop_on_databricks = false          # true = submit loop itself as Databricks Workflow
fallback           = "duckdb"       # duckdb | fail — what to do when Databricks unreachable
host_env           = "DATABRICKS_HOST"
token_env          = "DATABRICKS_TOKEN"
http_path_env      = "DATABRICKS_HTTP_PATH"   # required for execution = "warehouse"
catalog            = "workspace"      # default catalog on Databricks free trial (AWS); change to "main" on paid workspaces
schema             = "autoresearch"
trace_redact       = true           # strip prompt bodies from MLflow traces (privacy)
http_timeout_sec   = 60

# ── Experiment Limits ─────────────────────────────────────────────────────────
[limits]
max_token_count          = 800    # secondary constraint (cost_score hits 0 at this value)
max_run_seconds          = 30     # wall-clock budget per experiment
hard_timeout_seconds     = 90     # absolute kill if over this
max_experiments_session  = 10    # safety cap per autonomous session
deep_research_every_n    = 1      # trigger deep research every N experiments
stuck_threshold_discards = 3      # consecutive discards before forced deep research

