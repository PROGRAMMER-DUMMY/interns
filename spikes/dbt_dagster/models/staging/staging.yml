version: 2

models:
  - name: stg_transactions
    description: "Cleaned transactions (fact). PII identifiers dropped."
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - not_null
          - relationships:      # FK integrity -- the approved edge to patients
              to: ref('stg_patients')
              field: patient_id
  - name: stg_patients
    description: "Patients dimension, PII removed (PatientID, Gender, DOB only)."
    columns:
      - name: patient_id
        tests: [unique, not_null]
  - name: stg_departments
    description: "Departments lookup dimension."
    columns:
      - name: dept_id
        tests: [unique, not_null]
