# Gemini CLI Policy Engine rules for the autoresearch project.
#
# Status (2026-05): The workspace tier (project-level policies under
# .gemini/policies/) is non-functional — see
# https://github.com/google-gemini/gemini-cli/issues/18186 and
# https://geminicli.com/docs/reference/policy-engine.
#
# This file is the forward-looking equivalent of the deprecated
# `tools.allowed` block in `.gemini/settings.json`. Until the workspace
# tier is wired up, install it at user level to silence the deprecation
# warning:
#
#   PowerShell:
#     New-Item -ItemType SymbolicLink `
#       -Path "$env:USERPROFILE\.gemini\policies\autoresearch.toml" `
#       -Target "$PWD\.gemini\policies\autoresearch.toml"
#
#   Bash / WSL:
#     ln -s "$(pwd)/.gemini/policies/autoresearch.toml" \
#       "$HOME/.gemini/policies/autoresearch.toml"
#
# When workspace policies start being read, the symlink can be removed
# and this file alone will govern the project's allowlist.

# --- Governed KPI / data-engineering wrappers (preferred entry points) ---

[[rule]]
toolName       = "run_shell_command"
commandPrefix  = "uv run prepare-kpi-blocker-panel"
decision       = "allow"
priority       = 100

[[rule]]
toolName       = "run_shell_command"
commandPrefix  = "uv run apply-kpi-panel-answer"
decision       = "allow"
priority       = 100

[[rule]]
toolName       = "run_shell_command"
commandPrefix  = "uv run confirm-cli-agent-proposal"
